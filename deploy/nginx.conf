server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    # Sin esto, cualquier location con su propio add_header (p. ej. "location = /") pierde las cabeceras de
    # arriba: nginx solo hereda add_header si el nivel actual no define ninguno. merge (nginx >= 1.29.3) las suma.
    add_header_inherit merge;

    # Server-side secret; file is gitignored and mounted at runtime.
    include /etc/nginx/token.conf;   # provides: set $maite_token "...";

    # Webchat → n8n brain (TNMHHaKWEoO0rLhf, webhook maite-flames-web).
    # The token lives only here, never in the browser.
    location = /chat {
        limit_except POST { deny all; }   # solo POST
        client_max_body_size 8k;          # un mensaje de chat no necesita mas
        proxy_pass http://root-n8n-1:5678/webhook/maite-flames-web;
        proxy_set_header Host $host;
        proxy_set_header Content-Type "application/json";
        proxy_set_header x-maite-token $maite_token;
        proxy_read_timeout 60s;
        # ponytail: static hostname resolved at startup; if n8n's IP changes, restart nginx.
    }

    # Voice → n8n "Khun Aran-Web-Voice" (fIXicdKLRFpNp3xj, webhook khun-aran-voice): only transcribes
    # (OpenAI) and returns {"text"}; the browser then sends that text through /chat. Audio is not stored.
    # 1.5 MB is ~60 s of opus/aac at 32-64 kbps. The Content-Type (audio/webm, audio/mp4...) passes through.
    location = /voice {
        limit_except POST { deny all; }
        client_max_body_size 1500k;
        proxy_pass http://root-n8n-1:5678/webhook/khun-aran-voice;
        proxy_set_header Host $host;
        proxy_set_header x-maite-token $maite_token;
        proxy_read_timeout 45s;
    }

    # Weather widget → n8n endpoint "Khun Aran-Web-Weather" (TMD, Koh Samui).
    # If n8n is down the frontend tolerates the failure and hides the widget.
    location = /weather {
        proxy_pass http://root-n8n-1:5678/webhook/khun-aran-weather;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
    }

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
